name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform shells
        run: flutter create --platforms=ios,android --project-name=wakeup_in_time .

      - name: Configure iOS deployment target
        run: sed -i '' -E "s|^#? ?platform :ios, '.*'|platform :ios, '15.5'|" ios/Podfile

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          IPA_DIR="build/ios/ipa"
          mkdir -p "$IPA_DIR/Payload"
          cp -R build/ios/iphoneos/Runner.app "$IPA_DIR/Payload/Runner.app"
          cd "$IPA_DIR"
          zip -qry WakeUpInTime-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: wakeup-in-time-unsigned-ipa
          path: build/ios/ipa/WakeUpInTime-unsigned.ipa
          if-no-files-found: error
